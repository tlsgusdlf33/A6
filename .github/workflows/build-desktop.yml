name: Build desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "drawing2fea/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/build-desktop.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Drawing2FEA-Windows
          - os: macos-latest
            artifact: Drawing2FEA-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller pyamg pytest

      - name: Unit tests
        run: python -m pytest -q

      - name: Build app (PyInstaller)
        run: pyinstaller packaging/drawing2fea.spec --noconfirm

      - name: Self-test packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist/Drawing2FEA/Drawing2FEA.exe" -ArgumentList "--selftest" -Wait -PassThru
          Get-Content "$env:TEMP/drawing2fea_selftest.txt"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Self-test packaged app (macOS)
        if: runner.os == 'macOS'
        run: dist/Drawing2FEA.app/Contents/MacOS/Drawing2FEA --selftest

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Drawing2FEA -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent Drawing2FEA.app "../${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30
